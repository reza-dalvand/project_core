{% extends 'dashboard/base.html' %}
{% block title %}ایجاد تیکت{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">➕ ایجاد تیکت پشتیبانی</h4>
                <a href="{% url 'dashboard:tickets_list' %}" class="btn btn-outline-secondary btn-sm">
                    ← بازگشت
                </a>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">شماره تلفن کاربر <span class="text-danger">*</span></label>
                    <input type="tel" class="form-control" name="user_phone"
                           placeholder="09123456789" required>
                    <small class="text-muted">کاربر باید قبلاً ثبت‌نام کرده باشد</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">موضوع <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="subject"
                           placeholder="موضوع تیکت" required maxlength="200">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">پیام <span class="text-danger">*</span></label>
                    <textarea class="form-control" name="message" rows="4"
                              placeholder="متن پیام کاربر..." required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">اولویت</label>
                    <select class="form-select" name="priority">
                        {% for value, label in priority_choices %}
                            <option value="{{ value }}" {% if value == 'medium' %}selected{% endif %}>
                                {{ label }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    💾 ایجاد تیکت
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
