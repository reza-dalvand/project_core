{% extends 'dashboard/base.html' %}
{% block title %}ویرایش کاربر{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">✏️ ویرایش کاربر: <code>{{ user_obj.phone }}</code></h4>
                <a href="{% url 'dashboard:user_detail' user_obj.id %}" class="btn btn-outline-secondary btn-sm">
                    ← بازگشت
                </a>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">نام</label>
                        <input type="text" class="form-control" name="first_name"
                               value="{{ user_obj.first_name }}" placeholder="نام">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">نام خانوادگی</label>
                        <input type="text" class="form-control" name="last_name"
                               value="{{ user_obj.last_name }}" placeholder="نام خانوادگی">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">کد ملی</label>
                    <input type="text" class="form-control" name="national_id"
                           value="{{ user_obj.national_id }}" placeholder="۱۰ رقم"
                           maxlength="10" inputmode="numeric">
                </div>

                <hr>
                <h6 class="fw-bold mb-3">⚡ وضعیت حساب</h6>

                <div class="mb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                               name="is_verified" id="isVerified"
                               {% if user_obj.is_verified %}checked{% endif %}>
                        <label class="form-check-label" for="isVerified">
                            📱 شماره تایید شده
                        </label>
                    </div>
                </div>

                <div class="mb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                               name="is_staff" id="isStaff"
                               {% if user_obj.is_staff %}checked{% endif %}>
                        <label class="form-check-label" for="isStaff">
                            🛡️ دسترسی به پنل ادمین
                        </label>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                               name="is_active" id="isActive"
                               {% if user_obj.is_active %}checked{% endif %}
                               {% if user_obj.is_superuser %}disabled{% endif %}>
                        <label class="form-check-label" for="isActive">
                            ✅ حساب فعال
                        </label>
                    </div>
                    {% if user_obj.is_superuser %}
                        <small class="text-warning">
                            ⚠️ حساب سوپرادمین قابل غیرفعال‌سازی نیست
                        </small>
                    {% endif %}
                </div>

                <hr>

                <button type="submit" class="btn btn-primary w-100">
                    💾 ذخیره تغییرات
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
