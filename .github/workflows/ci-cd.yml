name: Zibano CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DJANGO_SETTINGS_MODULE: config.settings.development
  SECRET_KEY: test-secret-key-for-ci
  DB_ENGINE: django.db.backends.sqlite3
  DB_NAME: ':memory:'

jobs:
  # ═══════════ Lint ═══════════
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          pip install -r requirements/base.txt
          pip install ruff mypy
      - name: Ruff Check
        run: ruff check apps/ config/ shared/ tests/
      - name: Ruff Format Check
        run: ruff format --check apps/ config/ shared/

  # ═══════════ Tests ═══════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements/base.txt
          pip install pytest pytest-django pytest-cov factory-boy faker

      - name: Run Migrations
        run: python manage.py migrate --noinput

      - name: Create Initial Data
        run: python manage.py create_initial_data || true

      - name: Run Tests
        run: pytest tests/ -v --cov=apps --cov-report=xml --cov-report=html

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ═══════════ Build Docker ═══════════
  build:
    name: Build & Push Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/zibano-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/zibano-backend:${{ github.sha }}