# ═══════════════════════════════════════════════
#   BEAU CLUB — Docker Compose Production
# ═══════════════════════════════════════════════
services:
  # ═══════════ PostgreSQL + PostGIS ═══════════
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-beau}_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-beau}
      POSTGRES_USER: ${DB_USER:-beau}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-beau} -d ${DB_NAME:-beau}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - beau_net

  # ═══════════ Redis ═══════════
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-beau}_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *default-logging
    networks:
      - beau_net

  # ═══════════ Backend (Django + Gunicorn) ═══════════
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ${COMPOSE_PROJECT_NAME:-beau}_backend
    restart: always
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_ENGINE=django.contrib.gis.db.backends.postgis
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - prod_media:/app/media
      - prod_static:/app/staticfiles
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        gunicorn --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 120 --access-logfile - --error-logfile - config.wsgi:application
      "
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    networks:
      - beau_net

  # ═══════════ Celery Worker ═══════════
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ${COMPOSE_PROJECT_NAME:-beau}_celery_worker
    restart: always
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_ENGINE=django.contrib.gis.db.backends.postgis
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - prod_media:/app/media
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info -c 2 --logfile /app/logs/celery_worker.log
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *default-logging
    networks:
      - beau_net

  # ═══════════ Celery Beat ═══════════
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ${COMPOSE_PROJECT_NAME:-beau}_celery_beat
    restart: always
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DJANGO_ENV=production
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_ENGINE=django.contrib.gis.db.backends.postgis
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler --logfile /app/logs/celery_beat.log
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging
    networks:
      - beau_net

  # ═══════════ Daily Database Backup ═══════════
  db_backup:
    image: postgis/postgis:16-3.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-beau}_db_backup
    restart: always
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-beau}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: ${DB_NAME:-beau}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # ✅ روش پایدار برای آلپاین (بدون نیاز به crond)
    entrypoint: >
      sh -c '
        mkdir -p /backups &&
        while true; do
          echo "Starting backup at $$(date)"
          pg_dump -Fc $$PGDATABASE > /backups/beau_$$(date +\%Y\%m\%d_\%H\%M\%S).dump
          echo "Backup completed. Cleaning up old backups..."
          find /backups -name "*.dump" -mtime +7 -delete
          echo "Sleeping for 24 hours..."
          sleep 86400
        done
      '
    logging: *default-logging
    networks:
      - beau_net

volumes:
  postgres_data:
  redis_data:
  prod_media:
  prod_static:

networks:
  beau_net:
    driver: bridge
    name: beau_production_network