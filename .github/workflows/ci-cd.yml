name: 🚀 CI/CD - Beau Club

on:

  push:

    branches: [main, develop]

  pull_request:

    branches: [main, develop]

env:

  DJANGO_SETTINGS_MODULE: config.settings.test

  SECRET_KEY: ci-test-secret-key-not-for-production

  DB_ENGINE: django.contrib.gis.db.backends.postgis

  TEST_DB_NAME: test_beau

  DB_NAME: test_beau

  DB_USER: postgres

  DB_PASSWORD: postgres

  DB_HOST: localhost

  DB_PORT: "5432"

  REDIS_URL: redis://localhost:6379/0

  KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}

  SHAHKAR_API_URL: "https://s.api.ir/api/sw1/ShahkarLite"

  SHAHKAR_API_KEY: ${{ secrets.SHAHKAR_API_KEY }}

  ZARINPAL_MERCHANT_ID: "fake-merchant-id-for-ci"

  ZARINPAL_SANDBOX: "True"

jobs:

  # ═══════════════════════════════════════════════════════════════

  # LINT

  # ═══════════════════════════════════════════════════════════════

  lint:

    name: 🔍 Lint

    runs-on: ubuntu-latest

    continue-on-error: true

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: "pip"

          cache-dependency-path: "requirements/*.txt"

      - name: Install Dependencies

        run: |

          pip install -r requirements/base.txt

          pip install ruff

      - name: Ruff Check

        run: |

          ruff check apps/ config/ shared/ tests/ || true

      - name: Ruff Format Check

        run: |

          ruff format --check apps/ config/ shared/ tests/ || true

  # ═══════════════════════════════════════════════════════════════

  # TEST

  # ═══════════════════════════════════════════════════════════════

  test:

    name: 🧪 Test

    runs-on: ubuntu-latest

    needs: [lint]

    services:

      # ───────────────── PostgreSQL / PostGIS ─────────────────

      postgis:

        image: postgis/postgis:16-3.4-alpine

        env:

          POSTGRES_DB: test_beau

          POSTGRES_USER: postgres

          POSTGRES_PASSWORD: postgres

        ports:

          - 5432:5432

        options: >-

          --health-cmd "pg_isready -U postgres"

          --health-interval 10s

          --health-timeout 5s

          --health-retries 5

      # ───────────────── Redis ─────────────────

      redis:

        image: redis:7-alpine

        ports:

          - 6379:6379

        options: >-

          --health-cmd "redis-cli ping"

          --health-interval 10s

          --health-timeout 5s

          --health-retries 5

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: "pip"

          cache-dependency-path: "requirements/*.txt"

      # ───────────────── GIS Dependencies ─────────────────

      - name: Install GDAL / GEOS / PROJ

        run: |

          sudo apt-get update -qq

          sudo apt-get install -y -qq \

            gdal-bin \

            libgdal-dev \

            libgeos-dev \

            libgeos++-dev \

            proj-bin \

            libproj-dev \

            postgresql-client

      # ───────────────── PostgreSQL Extensions ─────────────────

      - name: Enable PostGIS & pg_trgm Extensions

        run: |

          PGPASSWORD=postgres psql \

            -h localhost \

            -U postgres \

            -d test_beau \

            -c "CREATE EXTENSION IF NOT EXISTS postgis;"

          PGPASSWORD=postgres psql \

            -h localhost \

            -U postgres \

            -d test_beau \

            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      # ───────────────── Python Dependencies ─────────────────

      - name: Install Python Dependencies

        run: |

          pip install -r requirements/development.txt

      # ───────────────── Django ─────────────────

      - name: Run Migrations

        run: |

          python manage.py migrate --noinput

      - name: Create Initial Data

        run: |

          python manage.py create_initial_data || true

      # ───────────────── Tests ─────────────────

      - name: Run Tests

        run: |

          pytest tests/ -v --tb=short --no-header

  # ═══════════════════════════════════════════════════════════════

  # DEPLOY

  # ═══════════════════════════════════════════════════════════════

  deploy:

    name: 🚀 Deploy

    runs-on: ubuntu-latest

    needs: [test]

    if: github.event_name == 'push'

    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}

    steps:

      - name: SSH & Deploy

        uses: appleboy/ssh-action@v1.0.3

        env:

          # ───────────────── Application ─────────────────

          APP_ENV: "production"

          # مهم:

          # COMPOSE_PROJECT_NAME و BACKEND_PORT عمداً اینجا

          # از GitHub Variables گرفته نمی‌شوند.

          #

          # این دو مقدار پایین و بر اساس branch تعیین می‌شوند.

          SECRET_KEY: ${{ secrets.SECRET_KEY }}

          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}

          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}

          FRONTEND_URL: ${{ vars.FRONTEND_URL }}

          # ───────────────── Database ─────────────────

          DB_NAME: ${{ secrets.DB_NAME }}

          DB_USER: ${{ secrets.DB_USER }}

          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          # ───────────────── SMS ─────────────────

          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}

          KAVENEGAR_OTP_TEMPLATE: ${{ vars.KAVENEGAR_OTP_TEMPLATE }}

          # ───────────────── Shahkar ─────────────────

          SHAHKAR_API_KEY: ${{ secrets.SHAHKAR_API_KEY }}

          # ───────────────── Payment ─────────────────

          ZARINPAL_MERCHANT_ID: ${{ secrets.ZARINPAL_MERCHANT_ID }}

          ZARINPAL_SANDBOX: ${{ vars.ZARINPAL_SANDBOX }}

          ZARINPAL_CALLBACK_URL: ${{ vars.ZARINPAL_CALLBACK_URL }}

          # ───────────────── Arvan ─────────────────

          ARVAN_ACCESS_KEY: ${{ secrets.ARVAN_ACCESS_KEY }}

          ARVAN_SECRET_KEY: ${{ secrets.ARVAN_SECRET_KEY }}

          ARVAN_BUCKET_NAME: ${{ vars.ARVAN_BUCKET_NAME }}

          ARVAN_ENDPOINT: ${{ vars.ARVAN_ENDPOINT }}

          ARVAN_REGION: ${{ vars.ARVAN_REGION }}

          ARVAN_CDN_URL: ${{ vars.ARVAN_CDN_URL }}

          # ───────────────── CORS ─────────────────

          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}

          # ───────────────── Admin URLs ─────────────────

          LANDING_ADMIN_URL: ${{ vars.LANDING_ADMIN_URL }}

          APP_ADMIN_URL: ${{ vars.APP_ADMIN_URL }}

          DASHBOARD_ADMIN_URL: ${{ vars.DASHBOARD_ADMIN_URL }}

          # ───────────────── Sentry ─────────────────

          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

        with:

          host: ${{ secrets.SERVER_HOST }}

          username: ${{ secrets.SERVER_USER }}

          key: ${{ secrets.SERVER_SSH_KEY }}

          envs: APP_ENV,SECRET_KEY,ALLOWED_HOSTS,SITE_DOMAIN,FRONTEND_URL,DB_NAME,DB_USER,DB_PASSWORD,KAVENEGAR_API_KEY,SHAHKAR_API_KEY,KAVENEGAR_OTP_TEMPLATE,ZARINPAL_MERCHANT_ID,ZARINPAL_SANDBOX,ZARINPAL_CALLBACK_URL,ARVAN_ACCESS_KEY,ARVAN_SECRET_KEY,ARVAN_BUCKET_NAME,ARVAN_ENDPOINT,ARVAN_REGION,ARVAN_CDN_URL,CORS_ALLOWED_ORIGINS,LANDING_ADMIN_URL,APP_ADMIN_URL,DASHBOARD_ADMIN_URL,SENTRY_DSN

          script: |

            set -e

            # ═══════════════════════════════════════════════════════

            # Branch / Environment Configuration

            # ═══════════════════════════════════════════════════════

            if [ "${{ github.ref_name }}" = "main" ]; then

              PROJECT_DIR="/home/deploy/beau"

              BRANCH="main"

              # Production

              CURRENT_COMPOSE_PROJECT_NAME="beau"

              CURRENT_BACKEND_PORT="8000"

            elif [ "${{ github.ref_name }}" = "develop" ]; then

              PROJECT_DIR="/home/deploy/beau-develop"

              BRANCH="develop"

              # Development

              CURRENT_COMPOSE_PROJECT_NAME="beau-develop"

              CURRENT_BACKEND_PORT="8001"

            else

              echo "❌ Unsupported branch: ${{ github.ref_name }}"

              exit 1

            fi

            # ═══════════════════════════════════════════════════════

            # Export values explicitly

            #

            # بسیار مهم:

            # این کار مانع می‌شود Docker Compose از یک

            # BACKEND_PORT اشتباه در shell environment استفاده کند.

            # ═══════════════════════════════════════════════════════

            export COMPOSE_PROJECT_NAME="$CURRENT_COMPOSE_PROJECT_NAME"

            export BACKEND_PORT="$CURRENT_BACKEND_PORT"

            echo "══════════════════════════════════════════════"

            echo "🎯 Branch: $BRANCH"

            echo "📂 Project Dir: $PROJECT_DIR"

            echo "📦 Compose Name: $COMPOSE_PROJECT_NAME"

            echo "🔢 Backend Port: $BACKEND_PORT"

            echo "══════════════════════════════════════════════"

            # ═══════════════════════════════════════════════════════

            # Project Directory

            # ═══════════════════════════════════════════════════════

            cd "$PROJECT_DIR"

            # ═══════════════════════════════════════════════════════

            # Git Update

            # ═══════════════════════════════════════════════════════

            git fetch origin

            git checkout "$BRANCH"

            git reset --hard "origin/$BRANCH"

            # ═══════════════════════════════════════════════════════

            # Generate Environment File

            # ═══════════════════════════════════════════════════════

            RAW_ALLOWED="${ALLOWED_HOSTS:-beauclub.ir,beuclub.ir,buclub.ir}"

            if [ "$BRANCH" = "main" ]; then
              BRANCH_DOMAIN="api.beauclub.ir"
            else
              BRANCH_DOMAIN="develop.beauclub.ir"
            fi

            FINAL_ALLOWED_HOSTS="${RAW_ALLOWED},${BRANCH_DOMAIN},localhost,127.0.0.1"

            cat << EOF > .env

            # ═══════════ Global App Environment ═══════════

            APP_ENV=production

            # ═══════════ Docker Environment ═══════════

            COMPOSE_PROJECT_NAME=${CURRENT_COMPOSE_PROJECT_NAME}

            BACKEND_PORT=${CURRENT_BACKEND_PORT}

            # ═══════════ Django ═══════════

            SECRET_KEY=${SECRET_KEY}

            DEBUG=False

            ALLOWED_HOSTS=${FINAL_ALLOWED_HOSTS}

            # ═══════════ Database ═══════════

            DB_ENGINE=django.contrib.gis.db.backends.postgis

            DB_NAME=${DB_NAME:-beau}

            DB_USER=${DB_USER:-beau}

            DB_PASSWORD=${DB_PASSWORD}

            DB_HOST=postgres

            DB_PORT=5432

            # ═══════════ Site ═══════════

            SITE_NAME=بیو کلاب

            SITE_DOMAIN=${SITE_DOMAIN:-https://api.beauclub.ir}

            FRONTEND_URL=${FRONTEND_URL:-https://beauclub.ir}

            # ═══════════ Redis ═══════════

            REDIS_URL=redis://redis:6379/0

            # ═══════════ SMS (Kavenegar) ═══════════

            KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY}

            KAVENEGAR_OTP_TEMPLATE=${KAVENEGAR_OTP_TEMPLATE:-test}

            # ═══════════ Shahkar ═══════════

            SHAHKAR_API_URL=https://s.api.ir/api/sw1/ShahkarLite

            SHAHKAR_API_KEY=${SHAHKAR_API_KEY}

            # ═══════════ Payment ═══════════

            ZARINPAL_MERCHANT_ID=${ZARINPAL_MERCHANT_ID}

            ZARINPAL_SANDBOX=${ZARINPAL_SANDBOX:-False}

            ZARINPAL_CALLBACK_URL=${ZARINPAL_CALLBACK_URL:-https://api.beauclub.ir/api/v1/payments/callback/}

            # ═══════════ Arvan Cloud S3 ═══════════

            ARVAN_ACCESS_KEY=${ARVAN_ACCESS_KEY}

            ARVAN_SECRET_KEY=${ARVAN_SECRET_KEY}

            ARVAN_BUCKET_NAME=${ARVAN_BUCKET_NAME:-beau}

            ARVAN_ENDPOINT=${ARVAN_ENDPOINT:-https://s3.ir-thr-at1.arvanstorage.ir}

            ARVAN_REGION=${ARVAN_REGION:-ir-thr-at1}

            ARVAN_CDN_URL=${ARVAN_CDN_URL:-cdn.beauclub.ir}

            # ═══════════ CORS ═══════════

            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://beauclub.ir,https://beuclub.ir,https://buclub.ir,https://app.beauclub.ir,capacitor://localhost}

            # ═══════════ Admin URLs ═══════════

            LANDING_ADMIN_URL=${LANDING_ADMIN_URL:-admin/}

            APP_ADMIN_URL=${APP_ADMIN_URL:-app-admin/}

            DASHBOARD_ADMIN_URL=${DASHBOARD_ADMIN_URL:-dashboard-admin/}

            # ═══════════ Sentry ═══════════

            SENTRY_DSN=${SENTRY_DSN}

            MEDIA_URL=/media/

            STATIC_URL=/static/

            EOF

            chmod 600 .env

            echo "✅ .env file generated successfully"

            # ═══════════════════════════════════════════════════════

            # Select Docker Compose command

            # ═══════════════════════════════════════════════════════

            if docker compose version >/dev/null 2>&1; then

              COMPOSE_CMD="docker compose"

            else

              COMPOSE_CMD="docker-compose"

            fi

            echo "🐳 Compose command: $COMPOSE_CMD"

            # ═══════════════════════════════════════════════════════

            # Validate Docker Compose Configuration

            # ═══════════════════════════════════════════════════════

            echo "🔍 Validating Docker Compose configuration..."

            # ═══════════════════════════════════════════════════════

            # Prepare Directories (Fix Permissions for Bind Mounts)

            # ═══════════════════════════════════════════════════════

            echo "📁 Preparing directories and fixing permissions..."

            mkdir -p logs

            chmod 777 logs  # اجازه نوشتن به appuser داخل کانتینر رو می‌ده

            $COMPOSE_CMD \

              -f docker-compose.prod.yml \

              config --quiet

            echo "✅ Docker Compose configuration is valid"

            # ═══════════════════════════════════════════════════════

            # Build Images

            # ═══════════════════════════════════════════════════════

            echo "🔨 Building Docker images..."

            $COMPOSE_CMD \

              -f docker-compose.prod.yml \

              build

            # ═══════════════════════════════════════════════════════

            # Stop Previous Environment

            # ═══════════════════════════════════════════════════════

            echo "🛑 Stopping previous containers..."

            $COMPOSE_CMD \

              -f docker-compose.prod.yml \

              down --remove-orphans

            # ═══════════════════════════════════════════════════════

            # Start Environment

            # ═══════════════════════════════════════════════════════

            echo "🚀 Starting containers..."

            $COMPOSE_CMD \

              -f docker-compose.prod.yml \

              up -d --remove-orphans

            # ═══════════════════════════════════════════════════════

            # Verify Published Port

            # ═══════════════════════════════════════════════════════

            echo "🔌 Verifying backend port..."

            ACTUAL_PORT=$(

              $COMPOSE_CMD \

                -f docker-compose.prod.yml \

                port backend 8000 \

                | head -n 1 \

                | sed -E 's/.*:([0-9]+)$/\1/'

            )

            echo "Expected backend port: ${CURRENT_BACKEND_PORT}"

            echo "Actual backend port:   ${ACTUAL_PORT}"

            if [ "$ACTUAL_PORT" != "$CURRENT_BACKEND_PORT" ]; then

              echo "❌ Backend port mismatch!"

              echo "Expected: ${CURRENT_BACKEND_PORT}"

              echo "Actual:   ${ACTUAL_PORT}"

              $COMPOSE_CMD \

                -f docker-compose.prod.yml \

                ps

              exit 1

            fi

            echo "✅ Backend port is correct"

            # ═══════════════════════════════════════════════════════

            # Wait for Backend

            # ═══════════════════════════════════════════════════════

            echo "⏳ Waiting for backend..."

            sleep 15

            # ═══════════════════════════════════════════════════════

            # Health Check

            #

            # از endpoint app-version استفاده شده چون اسکریپت health

            # پروژه نیز همین endpoint را استفاده می‌کند.

            # ═══════════════════════════════════════════════════════

            echo "🏥 Running backend health check..."

            HEALTH_PATH="/api/v1/config/app-version/"

            MAX_RETRIES=30

            RETRY_COUNT=0

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do

              HTTP_CODE=$(

                curl \

                  -sS \

                  -o /dev/null \

                  -w "%{http_code}" \

                  "http://127.0.0.1:${CURRENT_BACKEND_PORT}${HEALTH_PATH}" \

                  2>/dev/null || echo "000"

              )

              if [ "$HTTP_CODE" = "200" ]; then

                echo "✅ Backend is healthy!"

                echo "   URL: http://127.0.0.1:${CURRENT_BACKEND_PORT}${HEALTH_PATH}"

                echo "   HTTP: ${HTTP_CODE}"

                break

              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))

              echo "⚠️ Attempt ${RETRY_COUNT}/${MAX_RETRIES}"

              echo "   HTTP: ${HTTP_CODE}"

              sleep 5

            done

            # ═══════════════════════════════════════════════════════

            # Health Check Failure

            # ═══════════════════════════════════════════════════════

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then

              echo ""

              echo "❌ Backend failed health check!"

              echo ""

              echo "📋 Docker Compose status:"

              $COMPOSE_CMD \

                -f docker-compose.prod.yml \

                ps

              echo ""

              echo "📋 Backend logs:"

              $COMPOSE_CMD \

                -f docker-compose.prod.yml \

                logs backend \

                --tail=100

              echo ""

              echo "📋 Celery Worker logs:"

              $COMPOSE_CMD \

                -f docker-compose.prod.yml \

                logs celery_worker \

                --tail=50

              echo ""

              echo "📋 Celery Beat logs:"

              $COMPOSE_CMD \

                -f docker-compose.prod.yml \

                logs celery_beat \

                --tail=50

              exit 1

            fi

            # ═══════════════════════════════════════════════════════

            # Final Status

            # ═══════════════════════════════════════════════════════

            echo ""

            echo "══════════════════════════════════════════════"

            echo "✅ DEPLOYMENT SUCCESSFUL"

            echo "══════════════════════════════════════════════"

            echo "🎯 Branch: ${BRANCH}"

            echo "📂 Directory: ${PROJECT_DIR}"

            echo "📦 Compose Project: ${CURRENT_COMPOSE_PROJECT_NAME}"

            echo "🔢 Backend Port: ${CURRENT_BACKEND_PORT}"

            echo "🌐 Health: HTTP 200"

            echo "══════════════════════════════════════════════"