<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کد تایید | بیو کلاب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #F5F0EC 0%, #EFE7E1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 16px 48px rgba(44, 37, 33, 0.12);
            border: 1px solid #EEE5DF;
        }
        .btn-primary {
            background: linear-gradient(135deg, #A88B7D, #8D7468);
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
        }
        .btn-primary:hover { background: #8D7468; }
        .otp-input {
            direction: ltr;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 12px;
            border-radius: 14px;
            padding: 12px;
            border: 1.5px solid #DDD2CB;
        }
        .otp-input:focus {
            border-color: #A88B7D;
            box-shadow: 0 0 0 4px rgba(168, 139, 125, 0.12);
        }
        .link-btn {
            background: none;
            border: none;
            color: #8D7468;
            font-weight: 700;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="text-center fw-bold mb-2" style="font-size: 20px;">کد تایید پیامکی</h1>
        <p class="text-center text-muted mb-4" style="font-size: 14px;">
            کد ارسال شده به <strong>{{ masked_phone }}</strong> را وارد کنید
        </p>

        {% if error %}
            <div class="alert alert-danger py-2" style="font-size: 13px;">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="code" class="form-control otp-input" 
                   maxlength="5" inputmode="numeric" autocomplete="one-time-code"
                   placeholder="-----" required autofocus>
            <button type="submit" class="btn btn-primary w-100 mt-3">
                ورود به پنل مدیریت
            </button>
        </form>

        <form method="post" action="{% url 'dashboard:resend_otp' %}">
            {% csrf_token %}
            <button type="submit" class="link-btn d-block mx-auto mt-3">
                ارسال مجدد کد
            </button>
        </form>

        <a href="{% url 'dashboard:login' %}" class="d-block text-center mt-3" 
           style="font-size: 13px; color: #8B7F78;">
            ← بازگشت به صفحه ورود
        </a>
    </div>
</body>
</html>
