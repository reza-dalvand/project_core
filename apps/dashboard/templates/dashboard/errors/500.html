{% extends 'dashboard/base.html' %}
{% block title %}خطای سرور{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="stat-card text-center py-5">
            <div style="font-size: 72px; margin-bottom: 20px;">⚠️</div>
            <h2 class="fw-bold mb-3">خطای داخلی سرور</h2>
            <p class="text-muted mb-4">
                متاسفانه مشکلی در پردازش درخواست شما رخ داده است.
                تیم فنی از این خطا مطلع شده و در حال بررسی است.
                لطفاً دقایقی دیگر دوباره تلاش کنید.
            </p>
            <div class="d-flex gap-2 justify-content-center">
                <a href="{% url 'dashboard:home' %}" class="btn btn-primary">
                    🏠 بازگشت به داشبورد
                </a>
                <button onclick="location.reload()" class="btn btn-outline-secondary">
                    🔄 تلاش مجدد
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
