{% extends 'dashboard/base.html' %}

{% block title %}افزودن ادمین{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6">
        <div class="stat-card">
            <h4 class="fw-bold mb-3">➕ افزودن ادمین جدید</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">شماره تلفن کاربر</label>
                    <input type="tel" class="form-control" name="phone" placeholder="09123456789" required>
                    <small class="text-muted">کاربر باید قبلاً ثبت‌نام کرده باشد</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">نقش</label>
                    <select class="form-select" name="role">
                        <option value="">بدون نقش</option>
                        {% for role in roles %}
                        <option value="{{ role.id }}">{{ role.get_name_display }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    💾 افزودن ادمین
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
