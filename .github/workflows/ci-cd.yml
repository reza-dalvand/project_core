name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  DJANGO_SETTINGS_MODULE: config.settings.development
  SECRET_KEY: ci-test-secret-key-not-for-production
  DB_ENGINE: django.contrib.gis.db.backends.postgis
  DB_NAME: test_beau
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: localhost
  DB_PORT: "5432"
  REDIS_URL: redis://localhost:6379/0
  KAVENEGAR_API_KEY: ""
  SHAHKAR_API_URL: ""
  SHAHKAR_API_KEY: ""

jobs:
  # ═══════════ Lint ═══════════
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    continue-on-error: true   # فعلاً خطای lint جلوی deploy رو نگیره
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install Dependencies
        run: |
          pip install -r requirements/base.txt
          pip install ruff

      - name: Ruff Check
        run: ruff check apps/ config/ shared/ tests/ || true

      - name: Ruff Format Check
        run: ruff format --check apps/ config/ shared/ tests/ || true

  # ═══════════ Tests ═══════════
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgis:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: test_beau
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install GDAL / GEOS / PROJ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gdal-bin libgdal-dev \
            libgeos-dev libgeos++-dev \
            proj-bin libproj-dev \
            postgresql-client

      - name: Enable PostGIS & pg_trgm Extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -d test_beau -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -d test_beau -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Install Python Dependencies
        run: |
          pip install -r requirements/base.txt
          pip install pytest pytest-django pytest-cov factory-boy faker

      - name: Run Migrations
        run: python manage.py migrate --noinput

      - name: Create Initial Data
        run: python manage.py create_initial_data || true

      - name: Run Tests
        run: pytest tests/ -v --tb=short

  # ═══════════ Deploy ═══════════

  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            
            echo "══════════════════════════════════════"
            echo "🔍 Step 0: Environment Check"
            echo "══════════════════════════════════════"
            echo "Current user: $(whoami)"
            echo "Current dir: $(pwd)"
            echo "Docker version: $(docker --version)"
            
            # بررسی وجود docker compose plugin یا standalone
            if docker compose version > /dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
              echo "✅ Using: docker compose (plugin)"
            elif docker-compose version > /dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
              echo "✅ Using: docker-compose (standalone)"
            else
              echo "❌ Docker Compose not found!"
              exit 1
            fi
            
            echo "══════════════════════════════════════"
            echo "📂 Step 1: Navigate to project"
            echo "══════════════════════════════════════"
            cd /opt/beau-backend
            
            if [ ! -d ".git" ]; then
              echo "❌ /opt/beau-backend is NOT a git repository!"
              echo "   Fix: git clone <repo-url> /opt/beau-backend"
              exit 1
            fi
            
            echo "══════════════════════════════════════"
            echo "📥 Step 2: Pull latest code"
            echo "══════════════════════════════════════"
            echo "Current branch: $(git branch --show-current)"
            echo "Current commit: $(git log --oneline -1)"
            
            # اطمینان از branch درست
            git checkout main
            
            # stash تغییرات محلی احتمالی
            git stash || true
            
            git pull origin main
            
            echo "New commit: $(git log --oneline -1)"
            
            echo "══════════════════════════════════════"
            echo "🔨 Step 3: Build & Deploy"
            echo "══════════════════════════════════════"
            $COMPOSE_CMD -f docker-compose.prod.yml build --no-cache
            $COMPOSE_CMD -f docker-compose.prod.yml up -d
            
            echo "══════════════════════════════════════"
            echo "🩺 Step 4: Health Check"
            echo "══════════════════════════════════════"
            sleep 10
            $COMPOSE_CMD -f docker-compose.prod.yml ps
            
            # بررسی سلامت backend
            BACKEND_STATUS=$($COMPOSE_CMD -f docker-compose.prod.yml ps backend | grep -c "Up" || true)
            if [ "$BACKEND_STATUS" -eq 0 ]; then
              echo "❌ Backend is NOT running!"
              $COMPOSE_CMD -f docker-compose.prod.yml logs backend --tail=50
              exit 1
            fi
            
            echo "══════════════════════════════════════"
            echo "🧹 Step 5: Cleanup"
            echo "══════════════════════════════════════"
            docker image prune -f
            
            echo ""
            echo "✅ Deploy completed at $(date '+%Y-%m-%d %H:%M:%S')"
            echo "   Commit: $(git log --oneline -1)"