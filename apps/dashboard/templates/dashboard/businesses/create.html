{% extends 'dashboard/base.html' %}
{% block title %}ایجاد کسب‌وکار{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">➕ ایجاد کسب‌وکار جدید</h4>
                <a href="{% url 'dashboard:businesses_list' %}" class="btn btn-outline-secondary btn-sm">
                    ← بازگشت
                </a>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">نام کسب‌وکار <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">شماره تلفن مالک <span class="text-danger">*</span></label>
                        <input type="tel" class="form-control" name="owner_phone"
                               placeholder="09123456789" required>
                        <small class="text-muted">کاربر باید قبلاً ثبت‌نام کرده باشد</small>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">نوع کسب‌وکار <span class="text-danger">*</span></label>
                        <select class="form-select" name="category" required>
                            <option value="">انتخاب کنید...</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">استان <span class="text-danger">*</span></label>
                        <select class="form-select" name="province" required>
                            <option value="">انتخاب کنید...</option>
                            {% for prov in provinces %}
                                <option value="{{ prov.id }}">{{ prov.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">شهر <span class="text-danger">*</span></label>
                        <select class="form-select" name="city" required>
                            <option value="">انتخاب کنید...</option>
                            {% for city in cities %}
                                <option value="{{ city.id }}">{{ city.name }} ({{ city.province.name }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">آدرس <span class="text-danger">*</span></label>
                    <textarea class="form-control" name="address" rows="2" required
                              placeholder="آدرس کامل کسب‌وکار"></textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">تلفن تماس</label>
                        <input type="tel" class="form-control" name="phone">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">ساعات کاری</label>
                        <input type="text" class="form-control" name="working_hours"
                               placeholder="شنبه تا پنجشنبه ۹ تا ۱۸">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">درباره کسب‌وکار</label>
                    <textarea class="form-control" name="about" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">وضعیت اولیه</label>
                    <select class="form-select" name="status">
                        <option value="pending">در انتظار بررسی</option>
                        <option value="approved">تایید شده</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    💾 ایجاد کسب‌وکار
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
