{% extends 'dashboard/base.html' %}
{% block title %}ایجاد تسویه{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">➕ ایجاد تسویه دستی</h4>
                <a href="{% url 'dashboard:settlements_list' %}" class="btn btn-outline-secondary btn-sm">
                    ← بازگشت
                </a>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">کسب‌وکار <span class="text-danger">*</span></label>
                    <select class="form-select" name="business" required>
                        <option value="">انتخاب کنید...</option>
                        {% for b in businesses %}
                            <option value="{{ b.id }}">{{ b.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">مبلغ تسویه (تومان) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" name="amount"
                           min="1000" step="1000" required placeholder="500000">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">شماره شبا <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="bank_sheba"
                           placeholder="IR123456789012345678901234" maxlength="26" required>
                    <small class="text-muted">۲۶ کاراکتر: IR + ۲۴ رقم</small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">نام بانک <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="bank_name"
                           placeholder="بانک ملی" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    💾 ایجاد تسویه
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
