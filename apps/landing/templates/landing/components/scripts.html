<!-- ═══════════ اسکریپت‌ها ═══════════ -->
<script>
(function(){
  'use strict';
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  window.addEventListener('load', () => document.body.classList.add('loaded'));
  setTimeout(() => document.body.classList.add('loaded'), 600);

  /* هدر + منوی موبایل */
  const header = document.getElementById('siteHeader');
  const menuBtn = document.getElementById('menuBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  window.addEventListener('scroll', () => {
    header.querySelector('nav').classList.toggle('!py-2.5', window.scrollY > 60);
  }, {passive:true});
  menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
  document.querySelectorAll('.mobile-link').forEach(a =>
    a.addEventListener('click', () => mobileMenu.classList.add('hidden'))
  );

  /* استگر */
  document.querySelectorAll('[data-stagger]').forEach(p => {
    [...p.children].forEach((c,i) => {
      if(!c.classList.contains('reveal')) c.classList.add('reveal');
      c.style.setProperty('--d', (i * 90) + 'ms');
    });
  });

  /* Reveal */
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.14});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  /* شمارنده آمار */
  const fmt = (v,d) => v.toLocaleString('fa-IR',{minimumFractionDigits:d, maximumFractionDigits:d});
  function countUp(el){
    const target = parseFloat(el.dataset.count);
    const dec = parseInt(el.dataset.dec || '0', 10);
    const suffix = el.dataset.suffix || '';
    if(reduced){ el.textContent = fmt(target,dec) + suffix; return; }
    const dur = 1700, start = performance.now();
    (function tick(now){
      const p = Math.min(1,(now-start)/dur);
      const ease = 1 - Math.pow(1-p,3);
      el.textContent = fmt(target*ease,dec) + suffix;
      if(p < 1) requestAnimationFrame(tick);
    })(start);
  }
  const statIO = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ countUp(e.target); statIO.unobserve(e.target); } });
  }, {threshold:.5});
  document.querySelectorAll('.stat-num').forEach(el => statIO.observe(el));

  /* ═══════════ اسلایدر ═══════════ */
  const slider = document.getElementById('heroSlider');
  if(slider){
    const track = slider.querySelector('.slider-track');
    const slides = [...slider.querySelectorAll('.slide')];
    const dots = [...slider.querySelectorAll('.slider-dot')];
    const progressBar = document.getElementById('sliderProgress');
    const prevBtn = slider.querySelector('.slider-nav.prev');
    const nextBtn = slider.querySelector('.slider-nav.next');

    let current = 0;
    const total = slides.length;
    const interval = 5000; // 5 ثانیه بین هر اسلاید
    let autoplayTimer = null;
    let progressTimer = null;

    function goTo(idx){
      current = (idx + total) % total;
      track.style.transform = `translateX(${current * 100}%)`;
      dots.forEach((d,i) => d.classList.toggle('active', i === current));
      resetProgress();
    }

    function next(){ goTo(current + 1); }
    function prev(){ goTo(current - 1); }

    function resetProgress(){
      if(progressBar){
        progressBar.style.transition = 'none';
        progressBar.style.width = '0%';
        // force reflow
        progressBar.offsetWidth;
        progressBar.style.transition = `width ${interval}ms linear`;
        progressBar.style.width = '100%';
      }
    }

    function startAutoplay(){
      if(reduced) return;
      stopAutoplay();
      autoplayTimer = setInterval(next, interval);
      resetProgress();
    }

    function stopAutoplay(){
      if(autoplayTimer){ clearInterval(autoplayTimer); autoplayTimer = null; }
    }

    // دکمه‌ها
    if(nextBtn) nextBtn.addEventListener('click', () => { next(); startAutoplay(); });
    if(prevBtn) prevBtn.addEventListener('click', () => { prev(); startAutoplay(); });

    // dots
    dots.forEach(d => d.addEventListener('click', () => {
      goTo(parseInt(d.dataset.idx, 10));
      startAutoplay();
    }));

    // لمسی (swipe)
    let touchStartX = 0, touchEndX = 0;
    slider.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      stopAutoplay();
    }, {passive:true});
    slider.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if(Math.abs(diff) > 50){
        // RTL: swipe چپ = بعدی، swipe راست = قبلی
        if(diff > 0) prev(); else next();
      }
      startAutoplay();
    }, {passive:true});

    // توقف هنگام hover
    slider.addEventListener('mouseenter', stopAutoplay);
    slider.addEventListener('mouseleave', startAutoplay);

    // کلیدهای جهت‌دار
    slider.setAttribute('tabindex', '0');
    slider.addEventListener('keydown', e => {
      if(e.key === 'ArrowLeft'){ next(); startAutoplay(); }
      if(e.key === 'ArrowRight'){ prev(); startAutoplay(); }
    });

    startAutoplay();
  }

  /* آکاردئون */
  document.querySelectorAll('.faq-item').forEach(item => {
    const btn = item.querySelector('.faq-btn');
    btn.addEventListener('click', () => {
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item.open').forEach(o => {
        o.classList.remove('open');
        o.querySelector('.faq-btn').setAttribute('aria-expanded','false');
      });
      if(!isOpen){ item.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
    });
  });
})();

  /* ═══════════ فرم تماس با ما ═══════════ */
  const contactForm = document.getElementById('contactForm');
  if(contactForm){
    const alertBox = document.getElementById('contactAlert');
    const submitBtn = document.getElementById('contactSubmitBtn');
    const btnText = document.getElementById('contactBtnText');
    const btnIcon = document.getElementById('contactBtnIcon');
    const btnSpinner = document.getElementById('contactBtnSpinner');

    function showAlert(message, type){
      alertBox.textContent = message;
      alertBox.className = 'rounded-2xl px-4 py-3 text-sm font-bold';
      if(type === 'success'){
        alertBox.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
      } else {
        alertBox.classList.add('bg-rose-50', 'text-rose-700', 'border', 'border-rose-200');
      }
      alertBox.classList.remove('hidden');
      // اسکرول به پیام
      setTimeout(() => alertBox.scrollIntoView({behavior:'smooth', block:'center'}), 100);
    }

    contactForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      // اعتبارسنجی ساده
      const formData = new FormData(contactForm);
      const fullName = formData.get('full_name').trim();
      const phone = formData.get('phone').trim();
      const subject = formData.get('subject').trim();
      const message = formData.get('message').trim();

      if(!fullName || !phone || !subject || !message){
        showAlert('لطفاً تمام فیلدهای الزامی را پر کنید.', 'error');
        return;
      }

      // نمایش لودینگ
      submitBtn.disabled = true;
      btnText.textContent = 'در حال ارسال...';
      btnIcon.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      try {
        const response = await fetch('{% url "landing:submit_contact" %}', {
          method: 'POST',
          body: formData,
          headers: {
            'X-Requested-With': 'XMLHttpRequest',
          },
        });

        const data = await response.json();

        if(data.success){
          showAlert(data.message || 'پیام شما با موفقیت ارسال شد. به زودی با شما تماس خواهیم گرفت.', 'success');
          contactForm.reset();
        } else {
          const errorMsg = data.message || 'خطا در ارسال پیام. لطفاً دوباره تلاش کنید.';
          showAlert(errorMsg, 'error');
        }
      } catch(err) {
        showAlert('خطا در ارتباط با سرور. لطفاً اتصال اینترنت خود را بررسی کنید.', 'error');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'ارسال پیام';
        btnIcon.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
      }
    });
  }
</script>
