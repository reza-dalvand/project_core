{% extends 'dashboard/base.html' %}
{% block title %}بخش تماس با ما{% endblock %}
{% block content %}
<div class="row">
    <div class="col-lg-8">
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold mb-0">📞 بخش تماس با ما</h4>
                <a href="{% url 'dashboard:landing_settings' %}" class="btn btn-outline-secondary btn-sm">← تنظیمات لندینگ</a>
            </div>

            <form method="post">
                {% csrf_token %}

                <h6 class="fw-bold mb-3 mt-3">📝 محتوای اصلی</h6>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">متن بج</label>
                        <input type="text" class="form-control" name="badge_text"
                               value="{{ section.badge_text|default:'ارتباط با ما' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">آیکون بج</label>
                        <input type="text" class="form-control" name="badge_icon"
                               value="{{ section.badge_icon|default:'headset_mic' }}">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">عنوان</label>
                    <input type="text" class="form-control" name="title"
                           value="{{ section.title|default:'با ما در تماس باشید' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">توضیحات</label>
                    <textarea class="form-control" name="subtitle" rows="2">{{ section.subtitle|default:'' }}</textarea>
                </div>

                <h6 class="fw-bold mb-3 mt-4">📇 کارت اطلاعات</h6>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">عنوان کارت</label>
                        <input type="text" class="form-control" name="card_title"
                               value="{{ section.card_title|default:'راه‌های ارتباطی' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">توضیحات کارت</label>
                        <input type="text" class="form-control" name="card_description"
                               value="{{ section.card_description|default:'' }}">
                    </div>
                </div>

                <h6 class="fw-bold mb-3 mt-4">📬 فرم تماس</h6>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">عنوان فرم</label>
                        <input type="text" class="form-control" name="form_title"
                               value="{{ section.form_title|default:'ارسال پیام' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">توضیحات فرم</label>
                        <input type="text" class="form-control" name="form_description"
                               value="{{ section.form_description|default:'' }}">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">پیام موفقیت</label>
                    <textarea class="form-control" name="form_success_message" rows="2">{{ section.form_success_message|default:'' }}</textarea>
                </div>

                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="is_active" id="sectionActive"
                               {% if section.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="sectionActive">نمایش بخش</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    💾 ذخیره بخش تماس
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
