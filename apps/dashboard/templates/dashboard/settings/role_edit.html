{% extends 'dashboard/base.html' %}

{% block title %}ویرایش نقش{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6">
        <div class="stat-card">
            <h4 class="fw-bold mb-3">✏️ ویرایش نقش: {{ role.get_name_display }}</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">توضیحات</label>
                    <textarea class="form-control" name="description" rows="2">{{ role.description }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">دسترسی‌ها</label>
                    <div class="row">
                        {% for value, label in available_permissions %}
                        <div class="col-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="permissions" value="{{ value }}"
                                       id="perm_{{ value }}" {% if value in role.permissions %}checked{% endif %}>
                                <label class="form-check-label" for="perm_{{ value }}">{{ label }}</label>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="is_active" id="isActive"
                               {% if role.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="isActive">فعال</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    💾 ذخیره تغییرات
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
