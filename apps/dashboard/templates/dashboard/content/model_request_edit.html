{% extends 'dashboard/base.html' %}
{% block title %}ویرایش درخواست مدل{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">✏️ ویرایش درخواست مدل: {{ model_request.title }}</h4>
                <a href="{% url 'dashboard:model_requests_list' %}" class="btn btn-outline-secondary btn-sm">← بازگشت</a>
            </div>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">عنوان <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="title" value="{{ model_request.title }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">کسب‌وکار</label>
                        <input type="text" class="form-control" value="{{ model_request.business.name }}" disabled>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">توضیحات</label>
                    <textarea class="form-control" name="description" rows="2">{{ model_request.description }}</textarea>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">نوع هزینه</label>
                        <select class="form-select" name="cost_type">
                            {% for value, label in cost_type_choices %}
                                <option value="{{ value }}" {% if model_request.cost_type == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">درصد تخفیف</label>
                        <input type="number" class="form-control" name="discount" value="{{ model_request.discount }}" min="0" max="100">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">شماره تماس</label>
                        <input type="tel" class="form-control" name="contact_phone" value="{{ model_request.contact_phone }}">
                    </div>
                </div>
                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="is_urgent" id="isUrgent"
                               {% if model_request.is_urgent %}checked{% endif %}>
                        <label class="form-check-label" for="isUrgent">🔥 فوری</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">تغییر تصویر خدمت</label>
                    <input type="file" class="form-control" name="service_image" accept="image/*">
                </div>
                <button type="submit" class="btn btn-primary w-100">💾 ذخیره تغییرات</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
