<!-- ═══════════ Navbar ═══════════ -->
<nav class="navbar" id="navbar">
    <div class="nav-wrap">
        <a href="#" class="logo">
            <div class="logo-icon">
                <span class="material-icons">{{ site.logo_icon | default('spa') }}</span>
            </div>
            <span>{{ site.name | default('زیبانو') }}</span>
        </a>
        <ul class="nav-links" id="navLinks">
            {% for item in nav_items %}
            <li><a href="#{{ item.anchor }}">{{ item.label }}</a></li>
            {% endfor %}
        </ul>
        <div style="display:flex;gap:10px;align-items:center;">
            <a href="#download" class="btn btn-primary">دانلود اپلیکیشن</a>
        </div>
        <button class="burger" id="burger">
            <span class="material-icons" style="font-size:28px;color:var(--text);">menu</span>
        </button>
    </div>
</nav>
