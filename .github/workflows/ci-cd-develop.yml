name: 🚀 CI/CD - Develop

on:
  push:
    branches: [develop]

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  SECRET_KEY: ci-test-secret-key-not-for-production
  DB_ENGINE: django.contrib.gis.db.backends.postgis
  TEST_DB_NAME: test_beau
  DB_NAME: test_beau
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: localhost
  DB_PORT: "5432"
  REDIS_URL: redis://localhost:6379/0
  KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
  SHAHKAR_API_URL: "https://s.api.ir/api/sw1/ShahkarLite"
  SHAHKAR_API_KEY: ${{ secrets.SHAHKAR_API_KEY }}
  ZARINPAL_MERCHANT_ID: "fake-merchant-id-for-ci"
  ZARINPAL_SANDBOX: "True"

jobs:

  # ═══════════ Lint ═══════════
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install Dependencies
        run: |
          pip install -r requirements/base.txt
          pip install ruff

      - name: Ruff Check
        run: ruff check apps/ config/ shared/ tests/ || true

      - name: Ruff Format Check
        run: ruff format --check apps/ config/ shared/ tests/ || true


  # ═══════════ Tests ═══════════
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgis:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: test_beau
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install GDAL / GEOS / PROJ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gdal-bin libgdal-dev \
            libgeos-dev libgeos++-dev \
            proj-bin libproj-dev \
            postgresql-client

      - name: Enable PostGIS & pg_trgm Extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -d test_beau -c "CREATE EXTENSION IF NOT EXISTS postgis;"

          PGPASSWORD=postgres psql -h localhost -U postgres \
            -d test_beau -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Install Python Dependencies
        run: pip install -r requirements/development.txt

      - name: Run Migrations
        run: python manage.py migrate --noinput

      - name: Create Initial Data
        run: python manage.py create_initial_data || true

      - name: Run Tests
        run: pytest tests/ -v --tb=short --no-header


  # ═══════════ Deploy ═══════════
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [test]
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }} # انتخاب خودکار Environment

    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          SHAHKAR_API_KEY: ${{ secrets.SHAHKAR_API_KEY }}
          ZARINPAL_MERCHANT_ID: ${{ secrets.ZARINPAL_MERCHANT_ID }}
          ZARINPAL_SANDBOX: ${{ vars.ZARINPAL_SANDBOX }}
          ZARINPAL_CALLBACK_URL: ${{ vars.ZARINPAL_CALLBACK_URL }}
          ARVAN_ACCESS_KEY: ${{ secrets.ARVAN_ACCESS_KEY }}
          ARVAN_SECRET_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          ARVAN_BUCKET_NAME: ${{ vars.ARVAN_BUCKET_NAME || 'beau' }}
          ARVAN_ENDPOINT: ${{ vars.ARVAN_ENDPOINT || 'https://s3.ir-thr-at1.arvanstorage.ir' }}
          ARVAN_REGION: ${{ vars.ARVAN_REGION || 'ir-thr-at1' }}
          ARVAN_CDN_URL: ${{ vars.ARVAN_CDN_URL || 'cdn.beauclub.ir' }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_ENV,COMPOSE_PROJECT_NAME,BACKEND_PORT,SECRET_KEY,ALLOWED_HOSTS,SITE_DOMAIN,FRONTEND_URL,DB_NAME,DB_USER,DB_PASSWORD,KAVENEGAR_API_KEY,SHAHKAR_API_KEY,ZARINPAL_MERCHANT_ID,ZARINPAL_SANDBOX,ZARINPAL_CALLBACK_URL,ARVAN_ACCESS_KEY,ARVAN_SECRET_KEY,ARVAN_BUCKET_NAME,ARVAN_ENDPOINT,ARVAN_REGION,ARVAN_CDN_URL,CORS_ALLOWED_ORIGINS,SENTRY_DSN
          
          script: |
            set -e

            # تنظیم دایرکتوری بر اساس branch
            if [ "${{ github.ref_name }}" == "main" ]; then
              PROJECT_DIR="/home/deploy/beau"
              BRANCH="main"
            else
              PROJECT_DIR="/home/deploy/beau-develop"
              BRANCH="develop"
            fi

            echo "══════════════════════════════════════"
            echo "🎯 Environment: ${{ vars.APP_ENV }}"
            echo "📂 Project Dir: $PROJECT_DIR"
            echo "🔢 Port: ${{ vars.BACKEND_PORT }}"
            echo "══════════════════════════════════════"

            cd "$PROJECT_DIR"
            git fetch origin
            git checkout "$BRANCH"
            git reset --hard origin/"$BRANCH"

            # ✅ تولید خودکار فایل .env
            cat << 'EOF' > generate_env.py
            import os

            env_vars = {
                "APP_ENV": os.environ.get("APP_ENV", "production"),
                "COMPOSE_PROJECT_NAME": os.environ.get("COMPOSE_PROJECT_NAME", "beau_prod"),
                "BACKEND_PORT": os.environ.get("BACKEND_PORT", "8000"),
                "SECRET_KEY": os.environ.get("SECRET_KEY", ""),
                "DEBUG": "False",
                "ALLOWED_HOSTS": os.environ.get("ALLOWED_HOSTS", "localhost"),
                "DB_ENGINE": "django.contrib.gis.db.backends.postgis",
                "DB_NAME": os.environ.get("DB_NAME", "beau"),
                "DB_USER": os.environ.get("DB_USER", "beau"),
                "DB_PASSWORD": os.environ.get("DB_PASSWORD", ""),
                "DB_HOST": "postgres",
                "DB_PORT": "5432",
                "REDIS_URL": "redis://redis:6379/0",
                "SITE_NAME": "بیو کلاب",
                "SITE_DOMAIN": os.environ.get("SITE_DOMAIN", "https://api.beauclub.ir"),
                "FRONTEND_URL": os.environ.get("FRONTEND_URL", "https://beauclub.ir"),
                "KAVENEGAR_API_KEY": os.environ.get("KAVENEGAR_API_KEY", ""),
                "SHAHKAR_API_URL": "https://s.api.ir/api/sw1/ShahkarLite",
                "SHAHKAR_API_KEY": os.environ.get("SHAHKAR_API_KEY", ""),
                "ZARINPAL_MERCHANT_ID": os.environ.get("ZARINPAL_MERCHANT_ID", ""),
                "ZARINPAL_SANDBOX": os.environ.get("ZARINPAL_SANDBOX", "False"),
                "ZARINPAL_CALLBACK_URL": os.environ.get("ZARINPAL_CALLBACK_URL", "https://api.beauclub.ir/api/v1/payments/callback/"),
                "ARVAN_ACCESS_KEY": os.environ.get("ARVAN_ACCESS_KEY", ""),
                "ARVAN_SECRET_KEY": os.environ.get("ARVAN_SECRET_KEY", ""),
                "ARVAN_BUCKET_NAME": os.environ.get("ARVAN_BUCKET_NAME", "beau"),
                "ARVAN_ENDPOINT": os.environ.get("ARVAN_ENDPOINT", "https://s3.ir-thr-at1.arvanstorage.ir"),
                "ARVAN_REGION": os.environ.get("ARVAN_REGION", "ir-thr-at1"),
                "ARVAN_CDN_URL": os.environ.get("ARVAN_CDN_URL", "cdn.beauclub.ir"),
                "CORS_ALLOWED_ORIGINS": os.environ.get("CORS_ALLOWED_ORIGINS", "https://beauclub.ir"),
                "SENTRY_DSN": os.environ.get("SENTRY_DSN", ""),
            }

            with open(".env", "w") as f:
                for k, v in env_vars.items():
                    if v is not None and str(v) != "":
                        f.write(f"{k}={v}\n")
            EOF
            python3 generate_env.py
            rm generate_env.py
            chmod 600 .env
            echo "✅ .env file generated successfully"

            # اجرای Docker Compose
            if docker compose version > /dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            $COMPOSE_CMD -f docker-compose.prod.yml build
            $COMPOSE_CMD -f docker-compose.prod.yml down --remove-orphans
            $COMPOSE_CMD -f docker-compose.prod.yml up -d

            # Health Check
            echo "🏥 Running health check..."
            MAX_RETRIES=12
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -sf "http://127.0.0.1:${{ vars.BACKEND_PORT }}/api/v1/config/app-version/" > /dev/null 2>&1; then
                echo "✅ Backend is healthy!"
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 5
            done

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Backend failed to start!"
              $COMPOSE_CMD -f docker-compose.prod.yml logs backend --tail=50
              exit 1
            fi

            docker image prune -f --filter "until=168h"
            echo "✅ Deploy done at $(date '+%Y-%m-%d %H:%M:%S')"