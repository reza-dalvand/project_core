<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>دسترسی غیرمجاز | بیو کلاب</title>
<style>
@font-face {
font-family: 'Vazirmatn';
src: url('/static/dashboard/fonts/Vazirmatn-Regular.woff2') format('woff2');
font-weight: 400;
font-display: swap;
}
@font-face {
font-family: 'Vazirmatn';
src: url('/static/dashboard/fonts/Vazirmatn-Bold.woff2') format('woff2');
font-weight: 700;
font-display: swap;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
background: linear-gradient(135deg, #F5F0EC 0%, #EFE7E1 100%);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
color: #2C2521;
padding: 20px;
}
.error-card {
background: #fff;
border-radius: 24px;
padding: 48px 40px;
max-width: 480px;
width: 100%;
text-align: center;
box-shadow: 0 16px 48px rgba(44, 37, 33, 0.12);
border: 1px solid #EEE5DF;
}
.error-icon {
font-size: 80px;
margin-bottom: 24px;
}
.error-card h1 {
font-size: 24px;
font-weight: 800;
margin-bottom: 12px;
}
.error-card p {
color: #5A504B;
font-size: 15px;
line-height: 1.9;
margin-bottom: 32px;
}
.btn-group {
display: flex;
gap: 12px;
justify-content: center;
flex-wrap: wrap;
}
.btn {
display: inline-flex;
align-items: center;
gap: 8px;
padding: 12px 28px;
border-radius: 14px;
font-weight: 700;
font-size: 14px;
text-decoration: none;
transition: all 0.2s;
border: none;
cursor: pointer;
font-family: inherit;
}
.btn-primary {
background: linear-gradient(135deg, #A88B7D, #8D7468);
color: #fff;
box-shadow: 0 6px 20px rgba(168, 139, 125, 0.35);
}
.btn-primary:hover {
transform: translateY(-2px);
box-shadow: 0 10px 28px rgba(168, 139, 125, 0.45);
}
.btn-outline {
background: transparent;
color: #8D7468;
border: 1.5px solid #A88B7D;
}
.btn-outline:hover {
background: #A88B7D;
color: #fff;
}
</style>
</head>
<body>
<div class="error-card">
<div class="error-icon" aria-hidden="true">🔒</div>
<h1>دسترسی غیرمجاز</h1>
<p>
شما مجوز دسترسی به این بخش را ندارید.
در صورت نیاز، با سوپرادمین تماس بگیرید.
</p>
<div class="btn-group">
<a href="/dashboard/" class="btn btn-primary">🏠 بازگشت به داشبورد</a>
<a href="/dashboard/logout/" class="btn btn-outline">🚪 خروج</a>
</div>
</div>
</body>
</html>
