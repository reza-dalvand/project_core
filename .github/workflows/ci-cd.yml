name: 🚀 CI/CD - Beau Club

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  SECRET_KEY: ci-test-secret-key-not-for-production
  DB_ENGINE: django.contrib.gis.db.backends.postgis
  TEST_DB_NAME: test_beau
  DB_NAME: test_beau
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: localhost
  DB_PORT: "5432"
  REDIS_URL: redis://localhost:6379/0
  KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
  SHAHKAR_API_URL: "https://s.api.ir/api/sw1/ShahkarLite"
  SHAHKAR_API_KEY: ${{ secrets.SHAHKAR_API_KEY }}
  ZARINPAL_MERCHANT_ID: "fake-merchant-id-for-ci"
  ZARINPAL_SANDBOX: "True"

jobs:
  # ═══════════ Lint ═══════════
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"
      - name: Install Dependencies
        run: |
          pip install -r requirements/base.txt
          pip install ruff
      - name: Ruff Check
        run: ruff check apps/ config/ shared/ tests/ || true
      - name: Ruff Format Check
        run: ruff format --check apps/ config/ shared/ tests/ || true

  # ═══════════ Tests ═══════════
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgis:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: test_beau
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"
      - name: Install GDAL / GEOS / PROJ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gdal-bin libgdal-dev \
            libgeos-dev libgeos++-dev \
            proj-bin libproj-dev \
            postgresql-client
      - name: Enable PostGIS & pg_trgm Extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -d test_beau -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -d test_beau -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Install Python Dependencies
        run: pip install -r requirements/development.txt
      - name: Run Migrations
        run: python manage.py migrate --noinput
      - name: Create Initial Data
        run: python manage.py create_initial_data || true
      - name: Run Tests
        run: pytest tests/ -v --tb=short --no-header

  # ═══════════ Deploy ═══════════
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}

    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV: "production" # ✅ اجبار به production برای هر دو برنچ
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          SHAHKAR_API_KEY: ${{ secrets.SHAHKAR_API_KEY }}
          ZARINPAL_MERCHANT_ID: ${{ secrets.ZARINPAL_MERCHANT_ID }}
          ZARINPAL_SANDBOX: ${{ vars.ZARINPAL_SANDBOX }}
          ZARINPAL_CALLBACK_URL: ${{ vars.ZARINPAL_CALLBACK_URL }}
          ARVAN_ACCESS_KEY: ${{ secrets.ARVAN_ACCESS_KEY }}
          ARVAN_SECRET_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          ARVAN_BUCKET_NAME: ${{ vars.ARVAN_BUCKET_NAME }}
          ARVAN_ENDPOINT: ${{ vars.ARVAN_ENDPOINT }}
          ARVAN_REGION: ${{ vars.ARVAN_REGION }}
          ARVAN_CDN_URL: ${{ vars.ARVAN_CDN_URL }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          LANDING_ADMIN_URL: ${{ vars.LANDING_ADMIN_URL }}
          APP_ADMIN_URL: ${{ vars.APP_ADMIN_URL }}
          DASHBOARD_ADMIN_URL: ${{ vars.DASHBOARD_ADMIN_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_ENV,COMPOSE_PROJECT_NAME,BACKEND_PORT,SECRET_KEY,ALLOWED_HOSTS,SITE_DOMAIN,FRONTEND_URL,DB_NAME,DB_USER,DB_PASSWORD,KAVENEGAR_API_KEY,SHAHKAR_API_KEY,ZARINPAL_MERCHANT_ID,ZARINPAL_SANDBOX,ZARINPAL_CALLBACK_URL,ARVAN_ACCESS_KEY,ARVAN_SECRET_KEY,ARVAN_BUCKET_NAME,ARVAN_ENDPOINT,ARVAN_REGION,ARVAN_CDN_URL,CORS_ALLOWED_ORIGINS,LANDING_ADMIN_URL,APP_ADMIN_URL,DASHBOARD_ADMIN_URL,SENTRY_DSN
          
          script: |
            set -e

            # ═══════════ تنظیم متغیرهای اختصاصی بر اساس برنچ ═══════════
            if [ "${{ github.ref_name }}" == "main" ]; then
              PROJECT_DIR="/home/deploy/beau"
              BRANCH="main"
              # مقادیر پروداکشن (پورت 8000)
              CURRENT_COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-beau}"
              CURRENT_BACKEND_PORT="${BACKEND_PORT:-8000}"
            else
              PROJECT_DIR="/home/deploy/beau-develop"
              BRANCH="develop"
              # مقادیر دولوپ (پورت 8001 و نام متفاوت برای جلوگیری از تداخل کانتینرها)
              CURRENT_COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-beau-develop}"
              CURRENT_BACKEND_PORT="${BACKEND_PORT:-8001}"
            fi

            echo "══════════════════════════════════════"
            echo "🎯 Branch: $BRANCH"
            echo "📂 Project Dir: $PROJECT_DIR"
            echo "📦 Compose Name: $CURRENT_COMPOSE_PROJECT_NAME"
            echo "🔢 Port: $CURRENT_BACKEND_PORT"
            echo "══════════════════════════════════════"

            cd "$PROJECT_DIR"
            git fetch origin
            git checkout "$BRANCH"
            git reset --hard origin/"$BRANCH"

            # ✅ تولید فایل .env کامل و مجزا برای هر محیط
            # توجه: متغیرها بدون پیشوند ENV_ استفاده شده‌اند
            cat << EOF > .env
            # ═══════════ Global App Environment ═══════════
            APP_ENV=production

            # ═══════════ Docker Environment ═══════════
            COMPOSE_PROJECT_NAME=${CURRENT_COMPOSE_PROJECT_NAME}
            BACKEND_PORT=${CURRENT_BACKEND_PORT}

            # ═══════════ Django ═══════════
            SECRET_KEY=${SECRET_KEY}
            DEBUG=False
            ALLOWED_HOSTS=${ALLOWED_HOSTS:-beauclub.ir,beuclub.ir,buclub.ir,api.beauclub.ir,localhost,127.0.0.1}

            # ═══════════ Database ═══════════
            DB_ENGINE=django.contrib.gis.db.backends.postgis
            DB_NAME=${DB_NAME:-beau}
            DB_USER=${DB_USER:-beau}
            DB_PASSWORD=${DB_PASSWORD}
            DB_HOST=postgres
            DB_PORT=5432

            # ═══════════ Site ═══════════
            SITE_NAME=بیو کلاب
            SITE_DOMAIN=${SITE_DOMAIN:-https://api.beauclub.ir}
            FRONTEND_URL=${FRONTEND_URL:-https://beauclub.ir}

            # ═══════════ Redis ═══════════
            REDIS_URL=redis://redis:6379/0

            # ═══════════ SMS (Kavenegar) ═══════════
            KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY}

            # ═══════════ Shahkar (api.ir) ═══════════
            SHAHKAR_API_URL=https://s.api.ir/api/sw1/ShahkarLite
            SHAHKAR_API_KEY=${SHAHKAR_API_KEY}

            # ═══════════ Payment (ZarinPal) ═══════════
            ZARINPAL_MERCHANT_ID=${ZARINPAL_MERCHANT_ID}
            ZARINPAL_SANDBOX=${ZARINPAL_SANDBOX:-False}
            ZARINPAL_CALLBACK_URL=${ZARINPAL_CALLBACK_URL:-https://api.beauclub.ir/api/v1/payments/callback/}

            # ═══════════ Storage (Arvan Cloud S3) ═══════════
            ARVAN_ACCESS_KEY=${ARVAN_ACCESS_KEY}
            ARVAN_SECRET_KEY=${ARVAN_SECRET_KEY}
            ARVAN_BUCKET_NAME=${ARVAN_BUCKET_NAME:-beau}
            ARVAN_ENDPOINT=${ARVAN_ENDPOINT:-https://s3.ir-thr-at1.arvanstorage.ir}
            ARVAN_REGION=${ARVAN_REGION:-ir-thr-at1}
            ARVAN_CDN_URL=${ARVAN_CDN_URL:-cdn.beauclub.ir}

            # ═══════════ CORS ═══════════
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://beauclub.ir,https://beuclub.ir,https://buclub.ir,https://app.beauclub.ir,capacitor://localhost}

            # ═══════════ Admin URLs ═══════════
            LANDING_ADMIN_URL=${LANDING_ADMIN_URL:-admin/}
            APP_ADMIN_URL=${APP_ADMIN_URL:-app-admin/}
            DASHBOARD_ADMIN_URL=${DASHBOARD_ADMIN_URL:-dashboard-admin/}

            # ═══════════ Sentry ═══════════
            SENTRY_DSN=${SENTRY_DSN}

            MEDIA_URL=/media/
            STATIC_URL=/static/
            EOF
            chmod 600 .env
            echo "✅ .env file generated successfully"

            # انتخاب دستور Docker Compose
            if docker compose version > /dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            # بیلد و استارت سرویس‌ها
            $COMPOSE_CMD -f docker-compose.prod.yml build
            $COMPOSE_CMD -f docker-compose.prod.yml down --remove-orphans
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --remove-orphans

            # ═══════════ Health Check ═══════════
            # ✅ صبر اولیه برای اتمام migrationها
            echo "⏳ Waiting 30s for migrations to complete..."
            sleep 30

            echo "🏥 Running health check on port ${ENV_BACKEND_PORT}..."
            MAX_RETRIES=30
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              # ✅ اصلاح: استفاده از endpoint maintenance-status (همان‌ که Dockerfile استفاده می‌کند)
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${ENV_BACKEND_PORT}/api/v1/config/maintenance-status/" 2>/dev/null)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Backend is healthy! (HTTP $HTTP_CODE)"
                break
              fi
              echo "   Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES - HTTP $HTTP_CODE - waiting..."
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 5
            done

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Backend failed to start!"
              echo "📋 Last 50 lines of backend logs:"
              $COMPOSE_CMD -f docker-compose.prod.yml logs backend --tail=50
              exit 1
            fi