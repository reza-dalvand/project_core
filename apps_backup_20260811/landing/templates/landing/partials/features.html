{% if features_section %}
<!-- ═══════════ Features ═══════════ -->
<section class="section features reveal" id="features">
    <div class="container">
        <div class="section-head">
            <span class="badge">
                <span class="material-icons" style="font-size:14px">{{ features_section.badge_icon }}</span>
                {{ features_section.badge_text }}
            </span>
            <h2>{{ features_section.title }}</h2>
            <p>{{ features_section.subtitle }}</p>
        </div>
        <div class="features-grid">
            {% for feature in features %}
            <div class="feature reveal">
                <div class="feature-icon">
                    <span class="material-icons" style="font-size:28px">{{ feature.icon }}</span>
                </div>
                <h3>{{ feature.title }}</h3>
                <p>{{ feature.description }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
